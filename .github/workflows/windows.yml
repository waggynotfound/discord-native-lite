name: Windows checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install stable Rust with format and lint tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Check standalone test fixture formatting
        run: rustup run stable rustfmt --edition 2021 --check tests/fixture.rs
      - name: Lint application and tests
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Run unit tests
        run: cargo +stable test --locked
      - name: Build release executable
        run: cargo +stable build --release --locked
      - name: Build Windows installer and portable package
        shell: powershell
        env:
          RUSTUP_TOOLCHAIN: stable
        run: .\packaging\build-release.ps1
      - name: Test per-user install, launch and removal
        shell: powershell
        run: |
          $installers = @(Get-ChildItem dist/release -Recurse -Filter '*-windows-x64-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one installer.' }
          .\packaging\test-setup.ps1 -Setup $installers[0].FullName
